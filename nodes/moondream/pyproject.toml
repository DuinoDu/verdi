[project]
name = "verdi-node-moondream"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.52.4",
  "accelerate==1.7.0",
  "einops==0.8.1",
  "pyvips==2.2.3",
  "pyvips-binary==8.16.0",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 capable). Model code comes from the HF repo
# (trust_remote_code) at the pinned revision; pyvips-binary bundles libvips.
