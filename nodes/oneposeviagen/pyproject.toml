[project]
name = "verdi-node-oneposeviagen"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "xformers==0.0.32.post2",     # torch 2.8.0 build; attention backend (upstream app sets ATTN_BACKEND=xformers)
  "spconv-cu126==2.3.8",        # upstream spconv-cu121 (no cu121 on H20)
  "numpy==1.26.4",
  "scipy==1.14.1",
  "pillow",
  "opencv-python-headless==4.10.0.84",
  "easydict==1.13",
  "tqdm",
  "imageio==2.37.0",
  "trimesh==4.5.3",
  "open3d==0.18.0",
  "pytorch-lightning==2.5.2",
  "xatlas==0.0.9",
  "pyvista==0.44.2",
  "pymeshfix==0.17.0",
  "igraph==0.11.8",
  "plyfile",
  "safetensors",
  "huggingface-hub>=0.30,<1.0",
  "transformers==4.46.3",
  "rembg==2.0.65",              # imported at module level by amodal3r (never called)
  "onnxruntime==1.19.2",
  "utils3d",
  "nvdiffrast",
  "diff-gaussian-rasterization",
  "ninja",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "9a4eb15e4021b67b12c460c7057d642626897ec8" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git", rev = "253ac4fcea7de5f396371124af597e6cc957bfae" }
diff-gaussian-rasterization = { git = "https://github.com/autonomousvision/mip-splatting.git", rev = "dda02ab5ecf45d6edb8c540d9bb65c7e451345a9", subdirectory = "submodules/diff-gaussian-rasterization" }

[[tool.uv.dependency-metadata]]
name = "nvdiffrast"
version = "0.4.0"
requires-dist = ["numpy"]

[[tool.uv.dependency-metadata]]
name = "diff-gaussian-rasterization"
version = "0.0.0"
requires-dist = []

[tool.uv.extra-build-dependencies]
nvdiffrast = [{ requirement = "torch", match-runtime = true }, "numpy==1.26.4", "ninja"]
diff-gaussian-rasterization = [{ requirement = "torch", match-runtime = true }, "numpy==1.26.4", "ninja", "setuptools<80", "wheel"]

# torch 2.8.0 on PyPI is the cu128 build (sm_120 / RTX 5090); no extra index needed.
