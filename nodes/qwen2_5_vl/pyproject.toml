[project]
name = "verdi-node-qwen2-5-vl"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.51.3",
  "accelerate==1.7.0",
  "qwen-vl-utils==0.0.11",
  "jsonschema==4.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 + H20 OK; no cu121 GEMV SIGFPE).
