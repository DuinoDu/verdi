name = "qwen2_5_vl"
version = "0.1.0"
description = """
Qwen2.5-VL Instruct (Alibaba) vision-language model via HF transformers.
Ask questions about an image, several frames / a video, or plain text
(`chat` -> text), or get JSON that is validated against a JSON Schema you
supply (`structured` -> json). Decoding is greedy (deterministic).
Prompt: pass a short prompt as `-p prompt="..."` or a long one as a utf-8
.txt file `-i prompt_file=path.txt` (exactly one of the two).
Model sizes: 7b (default, ~17 GB VRAM), 3b (~9 GB); 32b (~70 GB VRAM, needs
a single >= 80 GB GPU, e.g. H20; does not fit a 32 GB RTX 5090) is
downloaded from the HF mirror on first use (65 GB, not pre-fetched by setup).
"""

[weights]
qwen2_5_vl_7b = { hf = "Qwen/Qwen2.5-VL-7B-Instruct", revision = "cc594898137f460bfe9f0759e9844b3ce807cfb5" }
qwen2_5_vl_3b = { hf = "Qwen/Qwen2.5-VL-3B-Instruct", revision = "66285546d2b821cf421d4f5eb2576359d3770cd3" }
# 65 GB: downloaded into HF_HOME on first use with model=32b (revision pinned in entry.py)
qwen2_5_vl_32b = { hf = "Qwen/Qwen2.5-VL-32B-Instruct", revision = "7cfb30d71a1f4f49a57592323337a4a4727301da", lazy = true }

[system]
gpu = { min_vram_gb = 24, arch = ["sm_120", "sm_80", "sm_86", "sm_89", "sm_90"] }
cuda = { driver = ">=12.6" }
disk_gb = 30

[run]
timeout_sec = 1800

[tasks.chat]
description = """
Free-form answer to a prompt about optional visual inputs. `image` is one
picture; `frames` is a frame sequence (or a video file) given to the model
as a video (frames_mode=video, uniformly subsampled to max_frames) or as
separate images (frames_mode=images). Both may be omitted for text-only
chat. The answer is written verbatim to answer.txt.
"""
inputs.image = { type = "image", optional = true }
inputs.frames = { type = "image_seq", optional = true, description = "frames of one clip (video files are split automatically)" }
inputs.prompt_file = { type = "text", optional = true, description = "prompt as a utf-8 .txt file (alternative to the prompt param)" }
outputs.answer = { type = "text", description = "model answer (utf-8)" }
params.prompt = { type = "str", default = "", description = "prompt text (alternative to the prompt_file input)" }
params.model = { type = "str", default = "7b", choices = ["3b", "7b", "32b"] }
params.max_new_tokens = { type = "int", default = 512 }
params.frames_mode = { type = "str", default = "video", choices = ["video", "images"], description = "how `frames` is fed to the model" }
params.max_frames = { type = "int", default = 32, description = "frames are uniformly subsampled to at most this many" }
params.max_pixels = { type = "int", default = 1003520, description = "per-image pixel budget (images are resized to fit; 1003520 = 1280*28*28)" }
params.system = { type = "str", default = "", description = "optional system prompt" }

[tasks.structured]
description = """
Answer as JSON that must validate against the given JSON Schema (draft
4/6/7/2019-09/2020-12; `$schema` selects the draft, default 2020-12). The
schema is shown to the model; its reply is parsed (a surrounding ```json
fence is tolerated) and validated with `jsonschema`. If the reply is not
valid JSON or violates the schema, the model gets exactly one corrective
retry with the validation error; if that also fails the task errors
(nothing is fabricated or repaired). Output = the parsed JSON value only.
Visual inputs and prompt work as in `chat`.
"""
inputs.image = { type = "image", optional = true }
inputs.frames = { type = "image_seq", optional = true, description = "frames of one clip (video files are split automatically)" }
inputs.prompt_file = { type = "text", optional = true, description = "prompt as a utf-8 .txt file (alternative to the prompt param)" }
inputs.schema = { type = "json", description = "a JSON Schema document describing the wanted answer" }
outputs.result = { type = "json", description = "the model answer, guaranteed to validate against `schema`" }
params.prompt = { type = "str", default = "", description = "prompt text (alternative to the prompt_file input)" }
params.model = { type = "str", default = "7b", choices = ["3b", "7b", "32b"] }
params.max_new_tokens = { type = "int", default = 1024 }
params.frames_mode = { type = "str", default = "video", choices = ["video", "images"] }
params.max_frames = { type = "int", default = 32 }
params.max_pixels = { type = "int", default = 1003520 }
params.retry = { type = "bool", default = true, description = "allow one corrective retry after an invalid reply" }

[[tests]]
name = "chat_image"
task = "chat"
timeout_sec = 900
inputs = { image = "tests/fixture/truck.jpg" }
params = { prompt = "What kind of vehicle is this? Answer with one or two lowercase words." }
[[tests.checks]]
output = "answer"
field = "text"
contains = "truck"
[[tests.checks]]
output = "answer"
field = "chars"
max = 40

[[tests]]
name = "chat_frames"
task = "chat"
timeout_sec = 900
inputs = { frames = "tests/fixture/bedroom", prompt_file = "tests/fixture/room_prompt.txt" }
[[tests.checks]]
output = "answer"
field = "text"
contains = "bedroom"
[[tests.checks]]
output = "answer"
field = "chars"
max = 20

[[tests]]
name = "structured"
task = "structured"
timeout_sec = 900
inputs = { image = "tests/fixture/truck.jpg", schema = "tests/fixture/vehicle_schema.json" }
params = { prompt = "Describe the main vehicle in this photo." }
[[tests.checks]]
output = "result"
field = "keys"
eq = ["background_wall_color", "body_color", "vehicle_type", "wheels_visible"]

[[known_issues]]
summary = "model=32b needs ~70 GB VRAM on one GPU (bf16, no sharding); it does not fit a 32 GB RTX 5090"
fix = "Use 7b/3b on 32 GB GPUs, or run 32b on an 80+ GB GPU (H20)"

[[known_issues]]
summary = "flash-attn is not installed; attention uses PyTorch SDPA"
fix = "Same outputs, somewhat higher memory for long videos; reduce max_frames / max_pixels if OOM"
