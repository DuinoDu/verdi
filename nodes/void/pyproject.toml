[project]
name = "pdebug-node-void"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
# Mirrors deps/void-model/requirements.txt @ e3914f8f (inference subset) plus
# the fixes from SimFoundry install_void.sh (av==12.3.0, numpy==1.26.4, rp).
dependencies = [
  "pdebug",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchdiffeq==0.2.5",
  "torchsde==0.2.6",
  "diffusers==0.33.1",
  "accelerate==1.12.0",
  "transformers==4.57.1",
  "safetensors==0.6.2",
  "peft==0.17.1",
  "opencv-python==4.10.0.84",
  "scikit-image==0.25.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "mediapy==1.2.4",
  "decord==0.6.0",
  "kornia==0.8.1",
  "albumentations==2.0.8",
  "timm==1.0.19",
  "tomesd==0.1.3",
  "Pillow==11.3.0",
  "numpy==1.26.4",
  "scipy==1.14.0",
  "scikit-learn==1.7.2",
  "einops==0.8.0",
  "omegaconf==2.3.0",
  "ml_collections==1.1.0",
  "absl-py==2.3.1",
  "loguru==0.7.3",
  "tqdm==4.67.1",
  "matplotlib==3.10.6",
  "sentencepiece==0.2.1",
  "ftfy==6.1.1",
  "beautifulsoup4==4.13.5",
  "func-timeout==4.3.5",
  "requests==2.32.5",
  "packaging==25.0",
  "av==12.3.0",
  "rp",
  "fire",
  "py3nvml",   # rp.pip_import(...) at run time in Pass 2 (rp would pip-install
  "moviepy",   # these on the fly; offline hosts cannot): py3nvml, moviepy, rich
  "rich",
  "easydict",  # CommonSource RAFT (rp.pip_import at run time)
]

[tool.uv]
package = false

[tool.uv.sources]
pdebug = { path = "../..", editable = true }
