[project]
name = "pdebug-node-segment-anything"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pdebug",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.1",
  "safetensors",
  "pillow",
  "numpy<2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
pdebug = { path = "../..", editable = true }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 capable); no extra index needed.
