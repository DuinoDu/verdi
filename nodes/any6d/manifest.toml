name = "any6d"
version = "0.1.0"
description = """
Any6D (CVPR 2025): model-free 6D pose AND metric size of a novel object
from one RGB-D frame, given an approximate object mesh of unknown scale
(e.g. generated by image-to-3D such as InstantMesh/Hunyuan3D). Built on
FoundationPose refiner/scorer networks (render-and-compare). Output poses
are T_cam_obj (object mesh frame -> OpenCV camera frame, metres).
"""

[upstream]
repo = "https://github.com/taeyeopl/Any6D.git"
commit = "80eb4866a1c96ecb18be18836aba4f4bd6e80e9e"   # same pin as SimFoundry
patches = [
  "patches/simfoundry_Any6D.patch",  # SimFoundry: PBR textures, register(return_all_poses), mycuda dtype
  "patches/mycpp_no_boost.patch",    # mycpp includes Boost headers it never uses
]

[weights]
# FoundationPose refiner (2023-10-28-18-33-37) + scorer (2024-01-11-20-02-45),
# HF mirror byte-identical to the official Google Drive release (see the
# foundationpose node).
fp = { hf = "gpue/foundationpose-weights", revision = "42d49e0633d245b3cf4dea6b1e7ec2b31d5b7654", files = ["2023-10-28-18-33-37/*", "2024-01-11-20-02-45/*"] }

[system]
gpu = { min_vram_gb = 8, arch = ["sm_120", "sm_80", "sm_86", "sm_89", "sm_90"] }
cuda = { driver = ">=12.6", toolkit = ">=12.6" }
compilers = { gcc = ">=9,<14", "g++" = ">=9,<14" }
binaries = ["git", "make"]  # cmake comes from the venv (PyPI `cmake`)
# Eigen3 headers + CMake config come from PyPI `cmeel-eigen` (venv, cmeel.prefix).
libs = ["libgomp.so.1", "libGL.so.1", "libEGL.so.1"]
disk_gb = 20

[build.env]
CUDA_HOME = "{cuda_home}"
TORCH_CUDA_ARCH_LIST = "{cuda_arch}"
FORCE_CUDA = "1"
MAX_JOBS = "16"
CC = "gcc"     # `c++` on the H20 PATH is clang, which rejects nvdiffrast narrowing
CXX = "g++"

[setup]
commands = [
  "cd foundationpose/mycpp && rm -rf build && mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DPYTHON_EXECUTABLE=$(which python) -Dpybind11_DIR=$(python -m pybind11 --cmakedir) -DCMAKE_PREFIX_PATH=$(python -c \"import sysconfig; print(sysconfig.get_paths()['purelib'])\")/cmeel.prefix > cmake.log && make -j16",
  "cd foundationpose && python -c 'import sys; sys.path.insert(0, \".\"); import mycpp.build.mycpp as m; print(\"mycpp ok\", m.__file__)'",
  # upstream hardcodes foundationpose/weights/<run_name>
  "ln -sfn {weights}/fp foundationpose/weights",
]

[run]
timeout_sec = 1800

[tasks.estimate]
description = """
Model-free pose + size (Any6D `register_any6d`, as in the official demo):
the input mesh may have ANY scale and origin (e.g. an image-to-3D mesh).
Any6D aligns the mesh's oriented box to the masked depth points, estimates
a per-axis metric scale (coarse box ratio, then render-and-compare over
sampled scales) and registers the pose with FoundationPose refiner+scorer.
Outputs the rescaled, re-centred mesh in metres and its pose. The pose
entry also carries size (mesh extents, m), scale (per-axis factor vs the
input mesh) and input_to_mesh (4x4 affine: input mesh coords -> output
mesh coords).
"""
inputs.image = { type = "image", description = "RGB frame" }
inputs.depth = { type = "depth", description = "metric depth aligned with image (metres, 0 = invalid)" }
inputs.mask = { type = "mask", description = "object mask (any non-zero pixel = object, or select one id with param mask_id)" }
inputs.camera = { type = "camera", description = "pinhole intrinsics of the image (distortion ignored)" }
inputs.mesh = { type = "mesh", description = "object mesh of arbitrary scale/origin (glb/obj; textured or vertex colours preferred)" }
outputs.poses = { type = "pose_set", description = "one pose: T_cam_obj of the OUTPUT mesh frame + size/scale/input_to_mesh" }
outputs.mesh = { type = "mesh", description = "input mesh rescaled to metres and centred (glb); the pose refers to this mesh" }
params.iteration = { type = "int", default = 5, description = "refiner iterations per hypothesis (upstream default 5)" }
params.mask_id = { type = "int", default = 0, description = "instance id to use from the mask; 0 = all non-zero pixels" }
params.label = { type = "str", default = "object", description = "label written into the pose" }

[tasks.register_candidates]
description = """
Ranked pose hypotheses for a mesh that is ALREADY metric (SimFoundry
stage 8 usage: Any6D `register(return_all_poses=True)` after scaling the
mesh itself, then a VLM picks among the top candidates). All rotation
hypotheses are refined and scored; the top_k are returned sorted by
scorer logit, T_cam_obj w.r.t. the input mesh frame. `renders` holds the
refiner's render of each candidate in its crop window (000000 = rank 0),
`reference` the matching observed RGB crop, for visual / VLM selection.
"""
inputs.image = { type = "image", description = "RGB frame" }
inputs.depth = { type = "depth", description = "metric depth aligned with image (metres, 0 = invalid)" }
inputs.mask = { type = "mask", description = "object mask (any non-zero pixel, or mask_id)" }
inputs.camera = { type = "camera", description = "pinhole intrinsics of the image (distortion ignored)" }
inputs.mesh = { type = "mesh", description = "object mesh in metres (glb/obj)" }
outputs.poses = { type = "pose_set", description = "top_k poses sorted by score (field rank = 0..k-1), T_cam_obj of the input mesh frame" }
outputs.renders = { type = "image_seq", description = "rendered crop of candidate rank i as %06d.png" }
outputs.reference = { type = "image", description = "observed RGB crop matching the rank-0 render window" }
params.top_k = { type = "int", default = 25, description = "number of ranked candidates to return (SimFoundry clusters the top 25)" }
params.iteration = { type = "int", default = 5, description = "refiner iterations per hypothesis" }
params.mask_id = { type = "int", default = 0, description = "instance id to use from the mask; 0 = all non-zero pixels" }
params.label = { type = "str", default = "object", description = "label written into the poses" }

[[tests]]
name = "estimate"
task = "estimate"
timeout_sec = 1200
inputs = { image = "tests/fixture/mustard/color.jpg", depth = "tests/fixture/mustard/depth.npy", mask = "tests/fixture/mustard/mask.png", camera = "tests/fixture/mustard/camera.json", mesh = "tests/fixture/mustard/mesh_generated.glb" }
[[tests.checks]]
output = "poses"
field = "count"
eq = 1
[[tests.checks]]
output = "poses"
metric = "pose_translation_err"
expected = "tests/expected/estimate_poses.json"
max = 0.01
# independent check: YCB-Video ground truth of this frame (labels.npz
# pose_y; centre of the YCB mustard model): the RTX 5090 host run is 1.3 cm away
[[tests.checks]]
output = "poses"
metric = "pose_translation_err"
expected = "tests/expected/ycb_gt_pose.json"
max = 0.03
# estimated metric size: YCB mustard bottle is 0.19 x 0.096 x 0.058 m
[[tests.checks]]
output = "poses"
path = "poses.0.size.0"
min = 0.17
max = 0.22
[[tests.checks]]
output = "mesh"
field = "max_extent"
min = 0.17
max = 0.22

[[tests]]
name = "candidates"
task = "register_candidates"
timeout_sec = 1200
inputs = { image = "tests/fixture/mustard/color.jpg", depth = "tests/fixture/mustard/depth.npy", mask = "tests/fixture/mustard/mask.png", camera = "tests/fixture/mustard/camera.json", mesh = "tests/fixture/mustard/mesh_metric.glb" }
params = { top_k = 5 }
[[tests.checks]]
output = "poses"
field = "count"
eq = 5
[[tests.checks]]
output = "poses"
metric = "pose_translation_err"
expected = "tests/expected/candidates_poses.json"
max = 0.01
[[tests.checks]]
output = "renders"
field = "count"
eq = 5

[[known_issues]]
summary = "Licence: Any6D code is academic/non-commercial only; FoundationPose weights and nvdiffrast are NVIDIA non-commercial"
fix = "Research use only; commercial use needs separate licences from Any6D (Taeyeop Lee) and NVIDIA"
