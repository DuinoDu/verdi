[project]
name = "pdebug-node-vggt"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pdebug",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy<2",
  "pillow",
  "vggt",
]

[tool.uv]
package = false

[tool.uv.sources]
pdebug = { path = "../..", editable = true }
vggt = { git = "https://github.com/facebookresearch/vggt.git", rev = "a288dd0f14786c93483e45524328726ab7b1b4ce" }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 / RTX 5090 support); no extra index needed.
