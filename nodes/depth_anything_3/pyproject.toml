[project]
name = "verdi-node-depth-anything-3"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "xformers==0.0.32.post2",
  "numpy<2",
  "opencv-python-headless==4.11.0.86",
  "depth-anything-3",
  # imported by depth_anything_3.model.da3 but not declared upstream (came in
  # via open3d 0.19 deps on the H20 lock; not on newer open3d)
  "addict==2.4.0",
]

[tool.uv]
package = false
# depth-anything-3 lists opencv-python; the headless build is enough here.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
verdi = { path = "../..", editable = true }
# same commit as SimFoundry install_da3.sh / install_simfoundry.sh (DA3_COMMIT)
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3.git", rev = "3d835ec1a5802d64a8b8b15f817a1ab54809bfe4" }

# torch 2.8.0 on PyPI is the cu128 build (sm_120); no extra index needed.
