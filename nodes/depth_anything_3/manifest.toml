[[known_issues]]
summary = "DA3NESTED-GIANT-LARGE-1.1 and DA3-GIANT-1.1 weights are CC-BY-NC-4.0 (non-commercial); DA3-LARGE-1.1 is listed CC BY-NC 4.0 in the upstream README (its HF card says apache-2.0); DA3METRIC-LARGE, DA3MONO-LARGE and the DA3 code are Apache-2.0"
fix = "non-commercial use only for estimate_depth / reconstruct (SimFoundry THIRD_PARTY_LICENSES row 6 covers the code only)"

[[known_issues]]
summary = "VRAM grows with frames per chunk (~22 GiB for 220 frames at 448 on SimFoundry's 24 GB GPUs)"
fix = "lower chunk_size (keep overlap >= 3, ideally >= 20) or process_res on smaller GPUs"

[[known_issues]]
summary = "Chunk merge needs camera motion inside the overlap; a static camera cannot be Sim(3)-aligned"
fix = "the node raises; raise chunk_size so the clip runs in one pass"

[[known_issues]]
summary = "Conditioned runs (poses input) return the input poses and their scale; they say nothing about the accuracy of those poses"
fix = "validate poses with a visual run + reference_poses (pose_eval); info.pose_source / trajectory.pose_source state which run is which"

[[known_issues]]
summary = "Network confidence is not calibrated; there is no per-pixel metric error estimate"
fix = "use confidence only to rank pixels within a run; check geometry against independent measurements (stereo, markers)"

[[known_issues]]
summary = "DA3NESTED's metres depend on its PREDICTED focal; on close-range indoor views it can be far off (TUM fr1 desk: fx 893 predicted vs 517 true -> depth ~2x too far; MapAnything 1.2-1.35x)"
fix = "pass the calibrated camera: model=metric (single image, abs-rel 0.024 on TUM) or nested + camera (known-focal metric scale; 3-frame reconstruct 0.98-1.03x); always check scale against an independent measurement (stereo, markers)"
