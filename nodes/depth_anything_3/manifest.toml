name = "depth_anything_3"
version = "0.1.0"
description = """
Depth Anything 3 (ByteDance Seed, 2025), the model SimFoundry uses for
depth and camera poses. DA3NESTED-GIANT-LARGE-1.1 (any-view giant model
+ metric model) gives METRIC depth in metres for one image, and for a
frame sequence also per-frame cameras (pose + intrinsics), with long
sequences split into overlapping chunks and merged with Sim(3) like
SimFoundry. reconstruct can also run the any-view DA3-GIANT-1.1 /
DA3-LARGE-1.1 (RELATIVE scale), use the ray head for poses
(use_ray_pose) and be CONDITIONED on known intrinsics + poses (output then
in the input-pose scale and marked so). DA3METRIC-LARGE (canonical depth,
metres = focal * output / 300) needs a known K. DA3MONO-LARGE gives
RELATIVE depth (returned as disparity). Every output states its
scale_status (metric | relative | input_pose_scale) and pose_source.
Separate from the `depth_anything` node (V2 / Video-Depth-Anything).
"""

[weights]
nested = { hf = "depth-anything/DA3NESTED-GIANT-LARGE-1.1", revision = "b2359bdf726fb44ef62acca04d629dcf158053e7", files = ["config.json", "model.safetensors"] }
mono = { hf = "depth-anything/DA3MONO-LARGE", revision = "f465978e618db8cc79c83b8bbf24964857db1875", files = ["config.json", "model.safetensors"] }
giant = { hf = "depth-anything/DA3-GIANT-1.1", revision = "72ee9f89ce4e50d704e9d55ee9c646ec8dc25a19", files = ["config.json", "model.safetensors"] }
large = { hf = "depth-anything/DA3-LARGE-1.1", revision = "0e109ae307c5982f319a67cf6f9f99ccdc0ec97c", files = ["config.json", "model.safetensors"] }
metric = { hf = "depth-anything/DA3METRIC-LARGE", revision = "4010e39f3634a45bc60553321fb49fb760bd594e", files = ["config.json", "model.safetensors"] }

[system]
gpu = { min_vram_gb = 24, arch = ["sm_120", "sm_80", "sm_86", "sm_89", "sm_90"] }
cuda = { driver = ">=12.6" }
disk_gb = 40

[run]
timeout_sec = 3600

[tasks.estimate_depth]
description = """
Metric z-depth (metres) for one image. model=nested (default):
DA3NESTED-GIANT-LARGE-1.1, output already in metres (its metric branch is
scaled with the PREDICTED focal internally); the predicted intrinsics are
returned as `camera`. With an optional known `camera` the nested metric
branch is scaled with the KNOWN focal instead of the predicted one (same
focal * output / 300 formula; info.focal shows predicted vs known): the
nested metric scale is only as good as its focal estimate (TUM fr1 desk:
predicted fx 893 px vs true 517 px -> depth 2.06x too far; with the known K
1.20x). model=metric: DA3METRIC-LARGE
(Apache-2.0) with a REQUIRED known `camera`: its output is canonical depth
and is converted with metres = focal * output / 300, focal = mean(fx, fy)
of the given K rescaled to the network resolution (upstream FAQ);
`camera` is echoed. SimFoundry `infer_depth` recipe: long side resized to
process_res, output resized back to the input size. Sky pixels are 0
(invalid) unless sky_invalid=false (then they hold the upstream filler).
`info` states model, conversion and intrinsics source.
"""
inputs.image = { type = "image" }
inputs.camera = { type = "camera", optional = true, description = "known pinhole K of the image, dist = 0: required for model=metric; for nested it replaces the predicted focal in the metric scaling" }
outputs.depth = { type = "depth", description = "metric z-depth in metres, input HxW, 0 = sky/invalid" }
outputs.camera = { type = "camera", description = "the input camera when given, else the intrinsics predicted by DA3NESTED at the input resolution" }
outputs.info = { type = "json", description = "{model, scale_status (metric), conversion, intrinsics_source, network_resolution, input_resolution, nested_metric_scale_factor, focal {predicted_focal_net, used: predicted|known, known_focal_net, predicted_fx_input_res}, sky_ratio, convention}" }
params.model = { type = "str", default = "nested", choices = ["nested", "metric"], description = "nested = DA3NESTED-GIANT-LARGE-1.1 (CC-BY-NC); metric = DA3METRIC-LARGE (Apache-2.0, needs camera)" }
params.process_res = { type = "int", default = 504, description = "network long side, multiple of 14 (504 = upstream and SimFoundry default)" }
params.sky_invalid = { type = "bool", default = true, description = "write 0 on sky pixels instead of the upstream filler depth" }

[tasks.estimate_relative_depth]
description = """
RELATIVE depth for one image with DA3MONO-LARGE (Apache-2.0 checkpoint,
monocular, no metric scale). DA3MONO predicts depth up to an unknown
scale; it is returned as disparity = 1/depth (larger = closer, unknown
scale, 0 = sky/invalid). NOT metres: use estimate_depth for metres.
"""
inputs.image = { type = "image" }
outputs.disparity = { type = "disparity", description = "1 / relative depth, input HxW, unknown scale, 0 = sky/invalid" }
params.process_res = { type = "int", default = 504, description = "network long side, multiple of 14" }

[tasks.reconstruct]
description = """
Multi-view reconstruction of a static scene from a frame sequence (ordered
video frames or a photo set; video input is split into frames; all frames
share one resolution): per-frame z-depth, T_world_cam and intrinsics in
one forward pass per chunk, as in SimFoundry stage s2_da. Sequences longer
than chunk_size are split into chunks overlapping by `overlap` frames.

Visual mode (no poses): poses and K are PREDICTED from the images (camera
decoder, or ray head with use_ray_pose=true - slower, upstream reports it
more accurate). Later chunks are Sim(3)-aligned to the first on the overlap
camera centres (Umeyama) and their depth multiplied by the fitted scale.
World = DA3 world of chunk 0. model=nested -> metres (scale_status
metric); giant / large -> arbitrary normalised scale (scale_status
relative, NOT metres). Optional `reference_poses` (e.g. robot FK or mocap)
are NEVER given to the model: they are only used afterwards to compute
`pose_eval` (Sim(3) and, for nested, rigid SE(3) ATE, rotation errors,
step-length ratio) = an independent check of those poses.

Conditioned mode (poses + camera/cameras): the known world-to-camera
extrinsics (inverted from T_world_cam) and K are fed to the DA3 camera
encoder. align_to_input_ext_scale=true (upstream default): output
T_world_cam = the input poses exactly, depth divided by the upstream
pose-alignment Sim(3) scale -> depth in the INPUT pose units
(scale_status input_pose_scale; the scale comes from the input poses, not
from vision). false: input poses Sim(3)-mapped into the prediction frame,
depth keeps the model scale (one chunk only). In both cases pose_source
says the poses are the input ones: such a run cannot validate them. Known
K WITHOUT poses (model=nested only): poses stay visual, the K
replaces the predicted focal in the nested metric scaling (info.metric_focal
= known; TUM 3-frame clip: depth 1.8x too far with the predicted focal,
0.98-1.03x with the known K); giant / large refuse K without poses
(upstream would ignore it).
"""
inputs.frames = { type = "image_seq" }
inputs.poses = { type = "trajectory", optional = true, description = "known T_world_cam per frame (same count/order as frames) for conditioning" }
inputs.camera = { type = "camera", optional = true, description = "shared pinhole K of all frames (dist = 0): with poses -> conditioning; without poses (nested) -> metric scale from the known focal" }
inputs.cameras = { type = "camera_seq", optional = true, description = "per-frame pinhole K (dist = 0), same semantics as camera" }
inputs.reference_poses = { type = "trajectory", optional = true, description = "visual mode only: poses to EVALUATE the prediction against (never used for inference)" }
outputs.depth = { type = "depth_seq", description = "per-frame z-depth (%06d.npy, input resolution, 0 = sky/invalid); units per info.scale_status" }
outputs.confidence = { type = "dir", description = "per-frame DA3 depth confidence %06d.npy (network output, uncalibrated, higher = more confident)" }
outputs.trajectory = { type = "trajectory", description = "T_world_cam (camera-to-world, OpenCV axes) per frame + frame_index, frames, units, scale_status, pose_source, world" }
outputs.cameras = { type = "camera_seq", description = "per-frame intrinsics at the input resolution (predicted, or the input ones when conditioned)" }
outputs.info = { type = "json", description = "{model, weights_key, scale_status, units, pose_source, intrinsics_source, world, conditioned_on_poses, metric_focal (known|predicted), align_to_input_ext_scale, use_ray_pose, ref_view_strategy, process_res, network_resolution, input_resolution, chunks [{start, size, sec, nested_metric_scale_factor, focal {predicted_focal_net, used, known_focal_net}, sim3_scale, overlap_residual_*, input_pose_alignment_scale_pred_per_input}], confidence, convention, frames, path_length}" }
outputs.pose_eval = { type = "json", optional = true, description = "only with reference_poses: {frames, sim3_scale_ref_per_pred, ate_rmse_after_sim3, ate_max_after_sim3, rotation_err_deg_after_sim3, ate_rmse_after_se3 (metric models), step_length_ratio_pred_over_ref, per_frame_*}" }
params.model = { type = "str", default = "nested", choices = ["nested", "giant", "large"], description = "nested = DA3NESTED-GIANT-LARGE-1.1 (metric), giant = DA3-GIANT-1.1, large = DA3-LARGE-1.1 (relative scale)" }
params.use_ray_pose = { type = "bool", default = false, description = "derive poses from the ray head instead of the camera decoder (upstream: slower, more accurate)" }
params.align_to_input_ext_scale = { type = "bool", default = true, description = "conditioned mode: true = output in the input-pose scale/frame; false = prediction scale/frame (one chunk)" }
params.process_res = { type = "int", default = 448, description = "network long side, multiple of 14 (448 = SimFoundry s2_da.resolution)" }
params.chunk_size = { type = "int", default = 220, description = "max frames per forward pass (SimFoundry 220); longer sequences are chunked" }
params.overlap = { type = "int", default = 40, description = "frames shared by consecutive chunks for the Sim(3) merge (>= 3; SimFoundry 40)" }
params.ref_view_strategy = { type = "str", default = "saddle_balanced", choices = ["saddle_balanced", "saddle_sim_range", "first", "middle"], description = "upstream reference-view selection inside a chunk" }
params.sky_invalid = { type = "bool", default = true, description = "write 0 on sky pixels instead of the upstream filler depth" }

