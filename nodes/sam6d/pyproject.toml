[project]
name = "verdi-node-sam6d"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy==1.26.4",  # trimesh 4.0.8 (upstream pin) needs numpy<2
  # Instance Segmentation Model (SAM + DINOv2; segment_anything is vendored upstream)
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "pytorch-lightning==2.5.2",
  "pycocotools==2.0.10",
  "distinctipy==1.3.4",
  "scikit-image==0.25.2",
  "imageio==2.37.0",
  "ruamel.yaml==0.18.14",
  "trimesh==4.0.8",
  "opencv-python-headless==4.11.0.86",
  # Pose Estimation Model
  "gorilla-core==0.2.7.8",
  "timm==0.9.16",
  "einops==0.8.1",
  # template rendering (downloads/uses its own Blender 3.3.1, see manifest [setup])
  "blenderproc==2.6.1",
  # pointnet2 CUDA extension build
  "setuptools<80",
  "ninja==1.11.1.4",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }

# torch 2.8.0 on PyPI is the cu128 build (sm_120); no extra index needed.
