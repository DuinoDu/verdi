[project]
name = "verdi-node-sam2"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "sam-2",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 capable); no extra index needed.
