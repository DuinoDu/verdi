[project]
name = "verdi-node-spatracker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy<2",
  "einops==0.8.1",
  "kornia==0.8.1",
  "timm==1.0.15",
  "jaxtyping==0.3.2",
  "huggingface-hub==0.33.0",
  "safetensors==0.5.3",
  "opencv-python-headless==4.11.0.86",
  "scipy==1.15.3",
  "matplotlib==3.10.3",
  "easydict==1.13",
  "decord==0.6.0",
  "pycolmap==3.11.1",
  "pyceres==2.4",
  "pyyaml==6.0.2",
  "tqdm",
  "scikit-learn",
  "flow-vis==0.1",
  "moviepy==1.0.0",
  "utils3d",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "d3a577acf0a9ad7e513a1416449a07b6f47d967f" }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 / RTX 5090 support); no extra index needed.
# [upstream] checkout (not a package); entry.py puts it on sys.path.
