name = "foundationpose"
version = "0.1.0"
description = """
NVIDIA FoundationPose: model-based 6D pose estimation and tracking of a
known object (CAD/scanned mesh) from RGB-D. Needs a metric depth map, the
camera intrinsics, a mask of the object on the first frame and a mesh in
metres. Output poses are T_cam_obj (object mesh frame -> OpenCV camera
frame, metres), i.e. relative to the mesh's own origin/axes.
"""

[upstream]
repo = "https://github.com/NVlabs/FoundationPose.git"
commit = "e3d597b8c6b851d053094ebd6fa240191c5238f8"   # same pin as SimFoundry
patches = [
  "patches/simfoundry_FoundationPose.patch",  # SimFoundry: mycuda dtype dispatch, c++17, req bounds
  "patches/mycpp_no_boost.patch",             # mycpp includes Boost headers it never uses
]

[weights]
# Official refiner (2023-10-28-18-33-37) + scorer (2024-01-11-20-02-45)
# checkpoints, mirrored on HF; sha256 identical to the official Google
# Drive release (774700586ddc..., 81924d384bf5...).
fp = { hf = "gpue/foundationpose-weights", revision = "42d49e0633d245b3cf4dea6b1e7ec2b31d5b7654", files = ["2023-10-28-18-33-37/*", "2024-01-11-20-02-45/*"] }

[system]
gpu = { min_vram_gb = 8, arch = ["sm_120", "sm_80", "sm_86", "sm_89", "sm_90"] }
cuda = { driver = ">=12.6", toolkit = ">=12.6" }
compilers = { gcc = ">=9,<14", "g++" = ">=9,<14" }
binaries = ["git", "make"]  # cmake comes from the venv (PyPI `cmake`)
# Eigen3 headers + CMake config come from PyPI `cmeel-eigen` (venv, cmeel.prefix).
libs = ["libgomp.so.1", "libGL.so.1", "libEGL.so.1"]
disk_gb = 20

[build.env]
CUDA_HOME = "{cuda_home}"
TORCH_CUDA_ARCH_LIST = "{cuda_arch}"
FORCE_CUDA = "1"
MAX_JOBS = "16"
CC = "gcc"     # `c++` on the H20 PATH is clang, which rejects nvdiffrast narrowing
CXX = "g++"

[setup]
commands = [
  # pybind11/Eigen C++ extension used to cluster the rotation hypotheses
  "cd mycpp && rm -rf build && mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DPYTHON_EXECUTABLE=$(which python) -Dpybind11_DIR=$(python -m pybind11 --cmakedir) -DCMAKE_PREFIX_PATH=$(python -c \"import sysconfig; print(sysconfig.get_paths()['purelib'])\")/cmeel.prefix > cmake.log && make -j16",
  "python -c 'import sys; sys.path.insert(0, \".\"); import mycpp.build.mycpp as m; print(\"mycpp ok\", m.__file__)'",
  # upstream hardcodes <repo>/weights/<run_name>; point it at the pinned weights
  "ln -sfn {weights}/fp weights",
]

[run]
timeout_sec = 1800

[tasks.estimate]
description = """
Register the object pose on one RGB-D frame (FoundationPose `register`:
sampled rotation hypotheses around the masked depth centroid, refined by
the refiner network and ranked by the scorer network). The mesh should be
textured for best results (glb/obj with texture or vertex colours) and in
metres; untextured meshes are rendered grey and work with lower accuracy.
"""
inputs.image = { type = "image", description = "RGB frame" }
inputs.depth = { type = "depth", description = "metric depth aligned with image (metres, 0 = invalid)" }
inputs.mask = { type = "mask", description = "object mask on the frame (any non-zero pixel = object, or select one id with param mask_id)" }
inputs.camera = { type = "camera", description = "pinhole intrinsics of the image (distortion ignored)" }
inputs.mesh = { type = "mesh", description = "object mesh in metres (glb preferred, textured)" }
outputs.poses = { type = "pose_set", description = "one pose: T_cam_obj of the mesh frame, score = best scorer logit" }
params.refine_iter = { type = "int", default = 5, description = "refiner iterations per hypothesis (upstream default 5)" }
params.mask_id = { type = "int", default = 0, description = "instance id to use from the mask; 0 = all non-zero pixels" }
params.label = { type = "str", default = "object", description = "label written into the pose" }
params.seed = { type = "int", default = 0, description = "random seed (upstream run_demo uses 0)" }

[tasks.track]
description = """
Register on the first frame (needs mask of frame 0) and then track the
object through the remaining frames (FoundationPose `track_one`, refiner
only, previous pose as initialisation). Frames must be consecutive video
frames with small inter-frame motion; image_seq and depth_seq are matched
by sorted order and must have the same length.
"""
inputs.frames = { type = "image_seq", description = "RGB frames" }
inputs.depths = { type = "depth_seq", description = "metric depth per frame (same count/order as frames)" }
inputs.mask = { type = "mask", description = "object mask on the FIRST frame" }
inputs.camera = { type = "camera", description = "pinhole intrinsics shared by all frames" }
inputs.mesh = { type = "mesh", description = "object mesh in metres (glb preferred, textured)" }
outputs.poses = { type = "pose_seq", description = "per frame index: one pose T_cam_obj of the mesh frame" }
params.refine_iter = { type = "int", default = 5, description = "refiner iterations for the first-frame registration" }
params.track_iter = { type = "int", default = 2, description = "refiner iterations per tracked frame (upstream default 2)" }
params.mask_id = { type = "int", default = 0, description = "instance id to use from the mask; 0 = all non-zero pixels" }
params.label = { type = "str", default = "object", description = "label written into the poses" }
params.seed = { type = "int", default = 0, description = "random seed" }

[[tests]]
name = "estimate"
task = "estimate"
timeout_sec = 900
inputs = { image = "tests/fixture/mustard/rgb/000000.jpg", depth = "tests/fixture/mustard/depth/000000.npy", mask = "tests/fixture/mustard/mask_000000.png", camera = "tests/fixture/mustard/camera.json", mesh = "tests/fixture/mustard/mesh.glb" }
[[tests.checks]]
output = "poses"
field = "count"
eq = 1
[[tests.checks]]
output = "poses"
metric = "pose_translation_err"
expected = "tests/expected/mustard_pose_000000.json"
max = 0.01

[[tests]]
name = "track"
task = "track"
timeout_sec = 900
inputs = { frames = "tests/fixture/mustard/rgb", depths = "tests/fixture/mustard/depth", mask = "tests/fixture/mustard/mask_000000.png", camera = "tests/fixture/mustard/camera.json", mesh = "tests/fixture/mustard/mesh.glb" }
[[tests.checks]]
output = "poses"
field = "count"
eq = 3
