[project]
name = "verdi-node-stable-normal"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "diffusers==0.30.3",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "safetensors",
  "opencv-python-headless==4.11.0.86",
  "einops==0.8.1",
  "scipy",
  "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }

# torch 2.8.0 on PyPI is the cu128 build (sm_120); no extra index needed.
# StableNormal's setup.py pins its whole gradio app env (torch 2.0, ...),
# so the upstream is used from the [upstream] checkout instead.
