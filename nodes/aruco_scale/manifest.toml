name = "aruco_scale"
version = "0.1.0"
description = """
Metric camera poses from a printed calibration board (ArUco grid, ChArUco
or AprilTag grid) with OpenCV cv2.aruco, and similarity (Sim3) alignment
of up-to-scale trajectories (vggt, mast3r_slam, ...) to that metric frame.
Deterministic algorithm node: CPU only, no weights.

World frame of all outputs = BOARD FRAME: origin at the centre of the
board pattern, x along the columns (right as printed), y towards row 0
(up as printed; row 0 = the top row of the printed board), z = board normal
pointing OUT of the printed side (towards a camera that sees the board).
A board lying face-up on a table therefore has z = up (against gravity).
Units: metres; camera frames: OpenCV (x right, y down, z forward).

Board spec (json input `board`):
  {"type": "charuco" | "aruco_grid" | "apriltag_grid",
   "dictionary": "DICT_5X5_100" (any cv2.aruco predefined name, "DICT_"
                 optional; apriltag_grid default "DICT_APRILTAG_36h11"),
   "rows": int, "cols": int   (ChArUco: squares; grids: markers),
   "marker_length_m": float   (outer black border of one marker),
   "square_length_m": float   (ChArUco only, chessboard square),
   "separation_m": float      (grids only, gap between markers; Kalibr
                               aprilgrid: tagSize * tagSpacing),
   "first_id": 0              (ids are first_id.. row-major from the top-left
                               marker as printed, OpenCV GridBoard/CharucoBoard
                               order),
   "ids": [..]                (optional explicit id list, overrides first_id),
   "legacy_pattern": false}   (ChArUco boards generated by OpenCV < 4.6 with
                               an even number of rows)
Metric accuracy is bounded by the printed size: measure a printed square
and put the measured length in the spec.
"""

[system]
disk_gb = 2

[run]
timeout_sec = 1800

[tasks.detect_board]
description = """
Detect the board in every frame and estimate the metric camera pose
(planar PnP: IPPE + Levenberg-Marquardt refinement on the detected
ChArUco chessboard corners or marker corners, lens distortion from the
camera). A frame is used when at least `min_points` board points are found
and the mean reprojection error is <= max_reproj_px. Video input is split
into frames automatically. Frame index = integer file stem (%06d names) or
the position in sorted order.
"""
inputs.frames = { type = "image_seq", description = "frames (or a video file) showing the board" }
inputs.camera = { type = "camera", description = "intrinsics + distortion of the frames (rescaled automatically if only the resolution differs at the same aspect)" }
inputs.board = { type = "json", description = "board spec, schema in the node description" }
outputs.trajectory = { type = "trajectory", description = "T_world_cam (camera-to-world, metres, world = board frame) for every USED frame only; frame_index / frames (file names) / timestamps (= frame_index) say which frames" }
outputs.detections = { type = "json", description = "{\"board\": spec, \"camera\": {K, dist, width, height} used, \"frames\": [{frame, file, marker_ids, marker_corners [[x,y]x4 px], charuco_ids, charuco_corners [[x,y] px] (ChArUco), points (2D-3D matches), reproj_err_px {mean, rms, max}, T_cam_board 4x4 (= T_cam_world), used, reason (why not used)}]} for EVERY frame" }
outputs.summary = { type = "json", description = "{frames_total, frames_detected, frames_used, frames_rejected [frame indices], mean_reproj_px, max_reproj_px, mean_points, camera_board_distance_m {min, mean, max}, camera_path_length_m, board {type, dictionary, rows, cols, size_m [w, h], ids, ...}, world_frame (text), board_orientation, gravity_world / up_world (unit vectors in the board frame, null if board_orientation=unknown), gravity_cam_first_used_frame, scale_anchor {source, marker_length_m, square_length_m, note}}" }
outputs.overlay = { type = "image_seq", optional = true, description = "only if overlay=true: frames with detected markers / ChArUco corners and the board axes (x red, y green, z blue) drawn (%06d.jpg by frame index)" }
params.board_orientation = { type = "str", default = "unknown", choices = ["unknown", "horizontal", "vertical"], description = "gravity hint: horizontal = board lies face-up (gravity = -z), vertical = board hangs upright with row 0 on top (gravity = -y)" }
params.min_points = { type = "int", default = 0, description = "minimum 2D-3D points for a pose; 0 = auto (6 ChArUco corners or 8 marker corners = 2 markers)" }
params.max_reproj_px = { type = "float", default = 2.0, description = "reject frames whose mean reprojection error exceeds this (px)" }
params.corner_refinement = { type = "str", default = "auto", choices = ["auto", "subpix", "contour", "apriltag", "none"], description = "cv2.aruco marker corner refinement; auto = apriltag for apriltag_grid (most accurate on the synthetic fixture: 0.14 px vs 0.35 px subpix), subpix otherwise (ChArUco chessboard corners are always sub-pixel refined)" }
params.overlay = { type = "bool", default = false, description = "also write the overlay image_seq for visual checking" }

[tasks.scale_align]
description = """
Align an up-to-scale trajectory (e.g. vggt / mast3r_slam output, same
frame indices) to a metric reference trajectory (detect_board output):
estimates the similarity p_ref = scale * R @ p_src + t over the frames
present in both (Umeyama on camera centres; if the centres are nearly
collinear, R comes from the camera orientations instead, see `method`),
then maps the whole source trajectory (all its frames) and optionally a
source point cloud / depth maps into the metric board frame. Frames are
matched by `frame_index` (else integer stems of `frames` names, else
position).
"""
inputs.trajectory = { type = "trajectory", description = "source trajectory, camera-to-world, arbitrary scale and world frame" }
inputs.reference = { type = "trajectory", description = "metric reference (detect_board trajectory output)" }
inputs.pointcloud = { type = "pointcloud", optional = true, description = "ply in the source world frame/unit (e.g. vggt pointcloud); transformed to metres in the board frame (normals rotated)" }
inputs.depth = { type = "depth_seq", optional = true, description = "source-unit depth maps (e.g. vggt depth); multiplied by scale" }
outputs.trajectory = { type = "trajectory", description = "every source frame in the metric board frame (other fields such as frames / frame_index copied)" }
outputs.alignment = { type = "json", description = "{scale, R 3x3, t [3], T_ref_src 4x4 (scale*R | t), convention, method (umeyama|orientation), shared_frames, n_shared, rmse_m, median_err_m, max_err_m (camera-centre residuals in metres), rot_err_deg_mean/max (orientation residuals after alignment), src_spread, src_singular_ratios, per_frame [{frame, err_m, rot_err_deg}]}" }
outputs.pointcloud = { type = "pointcloud", optional = true, description = "only with the pointcloud input: aligned ply (metres, board frame)" }
outputs.depth = { type = "depth_seq", optional = true, description = "only with the depth input: depth * scale (metres), same file names" }
params.method = { type = "str", default = "auto", choices = ["auto", "umeyama", "orientation"], description = "umeyama = Sim3 from camera centres only (fails on collinear motion); orientation = rotation from the mean of R_ref R_src^T, scale/translation by least squares on centres; auto = umeyama unless centres are nearly collinear (or < 3 shared frames)" }
params.min_frames = { type = "int", default = 3, description = "minimum number of shared frames" }
params.collinear_ratio = { type = "float", default = 0.05, description = "centres count as collinear when the 2nd/1st singular value ratio of the centred source positions is below this" }

