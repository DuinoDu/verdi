[[known_issues]]
summary = "Metric scale is only as accurate as the printed board size and the intrinsics"
fix = "measure the printed square/marker length and use it in the board spec; pass calibrated intrinsics (phone EXIF/estimated focal errors bias the distance)"

[[known_issues]]
summary = "Single-frame planar PnP can flip (pose ambiguity) for small, far or fronto-parallel boards"
fix = "both IPPE solutions are refined and the lower-error one kept; reject frames via max_reproj_px and check per-frame residuals in scale_align (per_frame)"
