[project]
name = "pdebug-node-p3sam"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
  "pdebug",
  "torch==2.8.0",
  # Sonata (PointTransformerV3) backbone deps (XPart/partgen/models/sonata)
  "spconv-cu126==2.3.8",
  "torch-scatter==2.1.2",
  "flash-attn==2.8.3",
  "timm==1.0.15",
  "addict==2.4.0",
  "huggingface-hub==0.30.2",
  "safetensors==0.4.5",
  "packaging",
  # P3-SAM auto-mask deps (P3-SAM/pyproject.toml in the SimFoundry patch)
  "numpy==1.26.4",
  "scipy==1.14.1",
  "trimesh==4.4.7",
  "networkx==3.3",
  "scikit-learn==1.5.2",
  "fpsample==0.3.3",
  "numba==0.60.0",
  "tqdm==4.66.5",
  "pillow",
  "matplotlib==3.9.2",   # tab20 part colours, same palette as SimFoundry
]

[tool.uv]
package = false

# torch-scatter is sdist-only and imports torch in setup.py: static metadata
# lets uv lock without building, then it is compiled against the runtime torch.
[[tool.uv.dependency-metadata]]
name = "torch-scatter"
version = "2.1.2"
requires-dist = []

# flash-attn: PyPI sdist built from source (FLASH_ATTENTION_FORCE_BUILD, archs
# in [build.env]); its setup.py imports torch, same static-metadata trick.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]

[tool.uv.extra-build-dependencies]
torch-scatter = [{ requirement = "torch", match-runtime = true }, "setuptools<80", "wheel", "ninja"]
flash-attn = [{ requirement = "torch", match-runtime = true }, "setuptools<80", "wheel", "ninja", "packaging", "psutil", "einops"]

[tool.uv.sources]
pdebug = { path = "../..", editable = true }

# torch 2.8.0 on PyPI is the cu128 build (sm_120 capable); no extra index needed.
