name = "sam3d_objects"
version = "0.1.0"
description = """
Meta SAM 3D Objects: one RGB image + object mask(s) -> per object a
textured 3D mesh (glb) plus its pose and size in the camera frame.
Pipeline (upstream InferencePipelinePointMap): MoGe point map of the full
image -> sparse-structure flow (geometry + layout: rotation, translation,
scale) -> structured-latent flow -> mesh / Gaussian decoders -> mesh
post-process + texture baking.
Scale: the pose and size are expressed in the units of the point map the
model is conditioned on. By default that is upstream's MoGe v1
(Ruicheng/moge-vitl) point map, which is scale-invariant (affine up to an
unknown global scale) -> poses/sizes are NOT metric ("units": "relative").
Give `depth` (metres) + `camera` and the point map is back-projected from
them instead -> poses/sizes are metric ("units": "metres"). For a phone
photo without depth, run the `moge` node (MoGe-2, metric) first and pass
its `depth` + `camera`.
Licence: SAM License (Meta; code and weights); DINOv2 Apache-2.0;
MoGe MIT.
"""

[upstream]
repo = "https://github.com/facebookresearch/sam-3d-objects.git"
commit = "f91db411c50efee93d8db7aeb323885650f6f722"
patches = ["patches/0001-no-kaolin.patch"]

[weights]
# facebook/sam-3d-objects is gated on HuggingFace (manual approval by Meta).
# Fetched from the ModelScope mirror of the same repo with the user's approval;
# every file is sha256-pinned (the yaml sha256 values equal the official HF
# git blob content, see NOTES.md). The SAM License applies.
pipeline_cfg = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/pipeline.yaml", filename = "pipeline.yaml", sha256 = "53c3d226b21df85c0bb3d16e6e4fa63abde0d6167525765eb929d02bfa9d358c" }
ss_generator_cfg = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/ss_generator.yaml", filename = "ss_generator.yaml", sha256 = "3c265448bca7c057f94e3ef56adea3a895a10bcd9f15f992a41dd03fa35412cd" }
slat_generator_cfg = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/slat_generator.yaml", filename = "slat_generator.yaml", sha256 = "53029fadff6fe34a0344381a16d64d65d0567d603484952712e8969319559c4e" }
