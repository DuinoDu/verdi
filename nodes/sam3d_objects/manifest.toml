slat_decoder_gs_cfg = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/slat_decoder_gs.yaml", filename = "slat_decoder_gs.yaml", sha256 = "53f054e02a0c185f0a6885d30bb6ca0ec92efe0a98148688e7f05f7c26afe670" }
slat_decoder_gs_4_cfg = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/slat_decoder_gs_4.yaml", filename = "slat_decoder_gs_4.yaml", sha256 = "3d1dfd4c56cdac56f30e0cf5eb310d4df973fe25c60ac0a462c86ca4e3bf8b48" }
slat_decoder_mesh_cfg = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/slat_decoder_mesh.yaml", filename = "slat_decoder_mesh.yaml", sha256 = "8f46952764aa985c50109a56f0b4f07625cdb06457aaded74957d26f3520c69e" }
