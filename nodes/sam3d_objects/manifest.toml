ss_decoder = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/ss_decoder.ckpt", filename = "ss_decoder.ckpt", sha256 = "6dac1cd7b7fda5a38e0614fadae441f1794f80e39ea2981f1ac8aff0a7e99340" }
slat_decoder_gs = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/slat_decoder_gs.ckpt", filename = "slat_decoder_gs.ckpt", sha256 = "f8077c36a06eaf890dd93cda1937411f793dea1eb80b3dd9329f2038ba84a111" }
slat_decoder_gs_4 = { url = "https://www.modelscope.cn/models/facebook/sam-3d-objects/resolve/master/checkpoints/slat_decoder_gs_4.ckpt", filename = "slat_decoder_gs_4.ckpt", sha256 = "731a0eceaa47945b52aa27f650d695b2aea9cc70945751e5609e5cb5b49f0186" }
