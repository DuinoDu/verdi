[project]
name = "verdi-node-sam3d-objects"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
  "verdi",
  # upstream: torch 2.5.1+cu121; 2.8.0 (PyPI cu128) is needed for sm_120
  "torch==2.8.0",
  "torchvision==0.23.0",
  "xformers==0.0.32.post2",    # torch 2.8.0 build (flash-attn: no wheel)
  "spconv-cu126==2.3.8",       # upstream spconv-cu121 2.3.8
  "numpy==1.26.4",
  "hydra-core==1.3.2",
  "omegaconf",
  "loguru==0.7.2",
  "astor==0.8.1",              # imported by sam3d_objects.data.utils
  "setuptools<80",             # pkg_resources (imported at module level upstream)
  "easydict==1.13",
  "einops",
  "timm==0.9.16",
  "lightning==2.3.3",
  "optree==0.14.1",
  "safetensors",
  "huggingface-hub>=0.30,<1.0",
  "scipy",
  "pillow",
  "opencv-python-headless==4.10.0.84",
  "imageio==2.37.0",
  "matplotlib",
  "trimesh==4.5.3",
  "open3d==0.18.0",
  "pyvista==0.44.2",
  "pymeshfix==0.17.0",
  "igraph==0.11.8",
  "xatlas==0.0.9",
  "plyfile",
  "tqdm",
  "gsplat",                    # upstream git pin 2323de59, CUDA ext built at install (layout_refine renders with gsplat)
  "moge",
  "utils3d",
  "pytorch3d",
  "diff-gaussian-rasterization",
  "nvdiffrast",                # utils3d RastContext in mesh hole filling (with_mesh_postprocess)
  "ninja",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }
# pins of upstream requirements.inference.txt / requirements.p3d.txt / MoGe
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "a8c37341bc0325ca99b9d57981cc3bb2bd3e255b" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "3913c65d81e05e47b9f367250cf8c0f7462a0900" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "75ebeeaea0908c5527e7b1e305fbc7681382db47" }
gsplat = { git = "https://github.com/nerfstudio-project/gsplat.git", rev = "2323de5905d5e90e035f792fe65bad0fedd413e7" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git", rev = "253ac4fcea7de5f396371124af597e6cc957bfae" }
# TRELLIS (v1) Gaussian rasteriser, as in nodes/oneposeviagen
diff-gaussian-rasterization = { git = "https://github.com/autonomousvision/mip-splatting.git", rev = "dda02ab5ecf45d6edb8c540d9bb65c7e451345a9", subdirectory = "submodules/diff-gaussian-rasterization" }

# MoGe also lists gradio/click/matplotlib (CLI + app only)
[[tool.uv.dependency-metadata]]
name = "moge"
version = "1.0.0"
requires-dist = ["torch", "torchvision", "numpy", "scipy", "opencv-python-headless", "pillow", "huggingface-hub", "utils3d", "trimesh"]

# utils3d lists moderngl (OpenGL rasteriser, unused here)
[[tool.uv.dependency-metadata]]
name = "utils3d"
version = "0.0.2"
requires-dist = ["numpy", "scipy"]

[[tool.uv.dependency-metadata]]
name = "pytorch3d"
version = "0.7.8"
requires-dist = ["iopath"]

[[tool.uv.dependency-metadata]]
name = "diff-gaussian-rasterization"
version = "0.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "nvdiffrast"
version = "0.4.0"
requires-dist = ["numpy"]

[[tool.uv.dependency-metadata]]
name = "gsplat"
version = "1.5.3"
requires-dist = ["ninja", "numpy", "jaxtyping", "rich>=12", "torch"]

[tool.uv.extra-build-dependencies]
gsplat = [{ requirement = "torch", match-runtime = true }, "numpy==1.26.4", "ninja", "setuptools<80", "wheel"]
nvdiffrast = [{ requirement = "torch", match-runtime = true }, "numpy==1.26.4", "ninja"]
pytorch3d = [{ requirement = "torch", match-runtime = true }, "setuptools<80", "wheel", "ninja"]
diff-gaussian-rasterization = [{ requirement = "torch", match-runtime = true }, "numpy==1.26.4", "ninja", "setuptools<80", "wheel"]

# torch 2.8.0 on PyPI is the cu128 build (sm_120 / RTX 5090); no extra index needed.
