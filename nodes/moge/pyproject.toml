[project]
name = "pdebug-node-moge"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pdebug",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "moge",
  "utils3d",
  "numpy<2.3",
  "scipy",
  "opencv-python-headless",
  "pillow",
  "huggingface-hub",
]

[tool.uv]
package = false

[tool.uv.sources]
pdebug = { path = "../..", editable = true }
# last MoGe-2-era commit (before the MoGe-3 "V3" refactor, which adds FlexGEMM/gradio deps)
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "925b8ed835a7a9cdb7578ba15c658a0afc969030" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "3fab839f0be9931dac7c8488eb0e1600c236e183" }

# Upstream also requires gradio / matplotlib / trimesh / pipeline (app + training
# only); inference (moge.model.v2) needs just these.
[[tool.uv.dependency-metadata]]
name = "moge"
version = "2.0.0"
requires-dist = ["torch", "torchvision", "numpy", "scipy", "opencv-python-headless", "pillow", "huggingface-hub", "utils3d", "click"]

# utils3d lists moderngl (OpenGL rasteriser, unused here)
[[tool.uv.dependency-metadata]]
name = "utils3d"
version = "1.3"
requires-dist = ["numpy", "scipy"]

# torch 2.8.0 on PyPI is the cu128 build (sm_120); no extra index needed.
