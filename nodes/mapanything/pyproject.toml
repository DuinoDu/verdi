[project]
name = "verdi-node-mapanything"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "verdi",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy<2.3",
  "mapanything",
  "opencv-python-headless==4.10.0.84",
  "pillow>=10",
]

[tool.uv]
package = false

[tool.uv.sources]
verdi = { path = "../..", editable = true }
mapanything = { git = "https://github.com/facebookresearch/map-anything.git", rev = "3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9" }
