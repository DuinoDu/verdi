[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdi"
version = "0.1.0"
description = "Verified, one-command model inference nodes for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Core deps are imported by node processes too (verdi.sdk / verdi.types):
# keep them tiny.
dependencies = [
  "numpy",
  "pillow",
  "packaging",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "huggingface_hub>=0.24", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
verdi = "verdi.cli.main:cli"

[tool.setuptools.packages.find]
include = ["verdi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
